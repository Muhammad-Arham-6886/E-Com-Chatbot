version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_commerce_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_commerce_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_commerce_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: ai_commerce_prod_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secure_redis_pass}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secure_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  ollama:
    image: ollama/ollama:latest
    container_name: ai_commerce_prod_ollama
    restart: always
    volumes:
      - ollama_prod_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_commerce_prod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_commerce_prod}
      REDIS_URL: redis://:${REDIS_PASSWORD:-secure_redis_pass}@redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    deploy:
      resources:
        limits:
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_commerce_prod_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    deploy:
      resources:
        limits:
          memory: 1G

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ai_commerce_prod_nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_prod_data:
  redis_prod_data:
  ollama_prod_models:
